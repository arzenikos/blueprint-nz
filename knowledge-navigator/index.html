<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Knowledge Navigator</title>

<link rel="stylesheet" href="style.css"/>
</head>

<body>

<div class="app">

    <!-- MAIN PANEL -->
    <main class="main">

        <header class="toolbar">
            <button id="backBtn">← Back</button>
            <div id="breadcrumbs"></div>
        </header>

        <section class="focus">

            <div id="focusCard"></div>

            <h3>Children</h3>
            <div id="children"></div>

        </section>

    </main>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-header">
            <button id="topBtn">⌂ Top</button>
        </div>

        <div class="sidebar-section">
            <h4>Path</h4>
            <div id="path"></div>
        </div>

        <div class="sidebar-section">
            <h4>Current Node</h4>
            <div id="currentNode"></div>
        </div>

        <div class="sidebar-section">
            <h4>Siblings</h4>
            <div id="siblings"></div>
        </div>

    </aside>

</div>

<script src="app.js"></script>

</body>
</html>
